name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Test (build + unit tests against the native engine and api double)
        run: npm test
      - name: Verify gateway entry loads
        run: node scripts/verify-entry.mjs
      # Live gateway integration (bench/integration*.mjs) needs an OpenAI key and
      # a real gateway daemon, so it is not run in CI — run it locally before release.
